# Inti OS 1.8 - arranque BIOS (syslinux).
#
# Sin video= fijo: se usa el modo nativo que entrega el firmware o la
# tarjeta virtual. scripts/run-qemu.sh detecta la resolucion del host y la
# pone en virtio-vga, asi que no hay franjas negras ni una ventana mas grande
# que el monitor. Ver la nota larga del grub.cfg.

LABEL titan
MENU LABEL Inti OS 1.8 (kernel propio, BIOS)
MENU DEFAULT
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200n8 console=tty0 lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia-drm.modeset=1 nvidia-drm.fbdev=1 cow_spacesize=1G quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL titan-compat
MENU LABEL Inti OS 1.8 (modo compatibilidad: VMs, Celeron, RTX, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200n8 console=tty0 lsm=landlock,lockdown,yama,integrity,apparmor,bpf titan.compat=1 modprobe.blacklist=nouveau cow_spacesize=2G quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL titan-rescue
MENU LABEL Inti OS 1.8 (rescate: kernel de Arch, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200n8 console=tty0 lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia-drm.modeset=1 nvidia-drm.fbdev=1 cow_spacesize=1G

LABEL titan-serial
MENU LABEL Inti OS 1.8 (verificacion: kernel propio por serie)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200n8 cow_spacesize=1G quiet
