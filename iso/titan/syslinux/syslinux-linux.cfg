# Titan Linux 0.1 - arranque BIOS (syslinux).
#
# Sin video= fijo: se usa el modo nativo que entrega el firmware o la
# tarjeta virtual. scripts/run-qemu.sh detecta la resolucion del host y la
# pone en virtio-vga, asi que no hay franjas negras ni una ventana mas grande
# que el monitor. Ver la nota larga del grub.cfg.

LABEL titan
MENU LABEL Titan Linux 0.1 (kernel propio, BIOS)
MENU DEFAULT
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8 cow_spacesize=1G

LABEL titan-rescue
MENU LABEL Titan Linux 0.1 (rescate: kernel de Arch, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8 cow_spacesize=1G

LABEL titan-serial
MENU LABEL Titan Linux 0.1 (verificacion: kernel propio por serie)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200n8 cow_spacesize=1G quiet
