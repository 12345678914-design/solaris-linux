# Titan Linux 0.1 - arranque UEFI (grub).
#
# Tres entradas a proposito:
#   1. el kernel propio del proyecto (linux-titanlinux), que es el producto
#   2. el kernel de Arch, que queda como entrada de rescate
#   3. el kernel propio forzado por consola serie, que es la que usan
#      scripts/verify-qemu.sh para comprobar la ISO sin intervencion
#
# console=ttyS0 esta en todas las entradas: no molesta en el modo grafico y
# permite verificar la ISO en QEMU con -nographic.
#
# No hay video= fijo. El firmware, o la tarjeta virtual que prepara
# scripts/run-qemu.sh, entregan el modo nativo de la pantalla. run-qemu.sh
# detecta la resolucion del host y la pone en la tarjeta virtio-vga, de modo
# que en un monitor de 1366x768 el escritorio mide 1366x768 y en uno de
# 1920x1080 mide 1920x1080. Un video= estatico dejaria franjas negras o una
# ventana mas grande que la pantalla.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Consola serie: menu de arranque y salida por ttyS0 a 115200 baudios.
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

set default="titan"
set timeout="10"
set timeout_style="menu"

menuentry "Titan Linux 0.1  (kernel propio %ARCH%, ${archiso_platform})" --class titan --class gnu-linux --class gnu --class os --id 'titan' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8 cow_spacesize=1G
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
}

menuentry "Titan Linux 0.1  (rescate: kernel de Arch, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'titan-rescue' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8 cow_spacesize=1G
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Titan Linux 0.1  (verificacion: kernel propio por serie)" --class titan --class gnu-linux --class gnu --class os --id 'titan-serial' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-titanlinux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200n8 cow_spacesize=1G quiet
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-titanlinux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'Apagando Titan Linux...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'Reiniciando Titan Linux...'
    reboot
}
