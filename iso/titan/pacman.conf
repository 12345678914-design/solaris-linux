#
# pacman.conf de la ISO de Titan Linux.
#
# Es el de Arch mas el repositorio local 'titan', que es donde
# scripts/build-iso.sh deposita linux-titanlinux-<ver>.pkg.tar.zst.
# La ruta se sustituye en tiempo de build: %TITAN_REPO%.
#
# Esto es lo que hace que la ISO contenga el kernel propio del proyecto y no
# solo una copia del de Arch: pacstrap lo instala como cualquier otro paquete.

[options]
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
DisableDownloadTimeout
# El repositorio local no esta firmado con la llave de Arch.
LocalFileSigLevel = Optional
SigLevel    = Required DatabaseOptional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[cachyos]
SigLevel = Optional TrustAll
Include = /etc/pacman.d/cachyos-mirrorlist

# Repositorio propio del proyecto. Solo se usa durante el build de la ISO.
[titan]
SigLevel = Optional TrustAll
Server = file://%TITAN_REPO%
