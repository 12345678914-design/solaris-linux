# ==============================================================================
# Calamares - Configuración principal de Inti OS
# ==============================================================================

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:       packages
    module:   packages
    config:   packages.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkmanager
      - hwclock
      - services-systemd
      - bootloader
      - grubcfg
      - packages
      - umount
  - show:
      - finished

branding: solaris
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
