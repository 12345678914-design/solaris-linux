# Inti OS - portales por defecto (copia de titan-portals.conf). Se usa si
# xdg-desktop-portal arranca sin XDG_CURRENT_DESKTOP: asi el de apariencia
# (claro/oscuro para Firefox y GTK) sigue siendo el de gtk.
#   ScreenCast/Screenshot: wlr (Meet, Zoom, Discord, OBS, capturas por portal)
#   Secret: gnome-keyring (contrasenas de apps Flatpak)
#   el resto (abrir/guardar ficheros, ajustes, notificaciones...): gtk
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Inhibit=none
