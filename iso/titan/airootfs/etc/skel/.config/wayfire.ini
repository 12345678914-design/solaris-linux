# Inti OS - sesion inmersiva con Wayfire 0.11
#
# Wayfire es el compositor por defecto cuando hay GPU con aceleracion 3D:
# aporta lo que labwc no tiene (animaciones de ventana, desenfoque real,
# deformacion al mover, vistas de ventanas y escritorios). Sin GPU (VMs sin
# 3D, nomodeset, titan.compat) la sesion sigue siendo labwc; lo decide
# /etc/profile.d/15-titan-grafico.sh.
#
# titan-shell (barra, Dock, centro de control...) es el mismo en las dos
# sesiones: usa layer-shell y wlr-foreign-toplevel, y en Wayfire ademas el
# IPC para los escritorios.
#
# Atajos (iguales que en labwc salvo los nuevos marcados con *):
#   Super                 Launchpad          Super+Espacio   Launchpad
#   Super+T               Terminal           Super+E         Archivos
#   Super+W               Fondos             Super+Shift+D   Claro/oscuro
#   Super+L               Bloquear           Super+Q/Alt+F4  Cerrar ventana
#   Super+I               Ajustes            Ctrl+Alt+Supr   Pantalla de seguridad
#   Super+V               Portapapeles       Super+.         Emojis
#   Super+F1              Lista de atajos    Ctrl+Mayús+Esc  Monitor de recursos
#   Super+X               Herramientas       Super+P         Proyectar (2.ª pantalla)
#   Impr Pant             Captura            Shift+Impr Pant Captura de una zona
#   Super+Shift+3 / 4 / S Captura (pantalla / zona / zona)
#   Super+Alt+S           Lector de pantalla
#   Super+M               Minimizar          Super+F         Maximizar
#   Super+Arriba          Escritorios (titan-shell)
#   Super+1..8            Ir al escritorio N
#  *Ctrl+Arriba / Super+Tab  Todas las ventanas (scale)
#  *Ctrl+Super+Arriba     Vista de escritorios (expo)
#  *Ctrl+Super+Izq/Der    Escritorio anterior/siguiente (con deslizamiento)
#  *Super+Izq/Der         Ventana a media pantalla
#   Alt+Tab               Cambiar de ventana
#  *3 dedos izq/der       Cambiar de escritorio (touchpad)
#   Super+arrastrar       Mover ventana      Super+boton der.  Redimensionar
#  *Super+Mayús+T         Acoplar/soltar esta ventana en el mosaico
#  *Super+Alt+flechas     Ir a la ventana de al lado (mosaico)

[core]
plugins = \
  alpha \
  animate \
  autostart \
  blur \
  command \
  expo \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  ipc \
  ipc-rules \
  move \
  place \
  resize \
  scale \
  session-lock \
  simple-tile \
  shortcuts-inhibit \
  titan-decor \
  titan-gestos \
  titan-wobbly-guard \
  vswipe \
  vswitch \
  wm-actions \
  wobbly \
  xdg-activation

# Escritorios en una fila; titan-shell muestra solo los que esten en uso.
vwidth = 8
vheight = 1

# Las apps dibujan su propia barra (las Titan son sin marco con semaforos,
# Firefox y GTK con CSD). titan-decor pone la barra Titan (semaforos) a las
# XWayland (OnlyOffice) y a las de [titan-decor] forced_views (kitty).
preferred_decoration_mode = client
xwayland = true
# Cerrar: Win+Q (Inti) o Alt+F4 (como Windows)
close_top_view = <super> KEY_Q | <alt> KEY_F4
background_color = 0.06 0.07 0.12 1.0
focus_button_with_modifiers = false

# Ratón y panel táctil (Ajustes > Ratón y panel táctil lo cambia). Como en
# Ubuntu/macOS: tocar para hacer clic, desplazamiento natural con dos dedos y
# sin clics con la palma mientras se escribe. El teclado lo pone
# titan-distribucion al entrar (xkb_layout, la elegida al instalar).
[input]
tap_to_click = true
natural_scroll = true
disable_touchpad_while_typing = true

[autostart]
autostart_wf_shell = false
titan = /usr/local/bin/titan-sesion

# ---------------------------------------------------------------------------
# Animaciones
# ---------------------------------------------------------------------------
[animate]
# Abrir y cerrar: zoom suave desde el centro de la ventana.
open_animation = zoom
close_animation = zoom
zoom_duration = 200ms circle
# Minimizar: la ventana se "aspira" hacia su icono del Dock (titan-shell le
# pasa la posicion con wlr-foreign-toplevel set_rectangle). Al restaurar
# desde el Dock hace el camino inverso.
minimize_animation = zoom
squeezimize_duration = 220ms circle
duration = 260ms circle
fade_duration = 160ms circle
startup_duration = 600ms circle
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
# Los paneles de titan-shell ya se animan en QML; solo el resto de overlays
# (menus emergentes de otras apps) hace fundido.
fade_enabled_for = type equals "overlay" & !(app_id contains "titan-")

# Maximizar, media pantalla y restaurar: fundido cruzado entre tamanos.
[grid]
type = crossfade
duration = 300ms circle
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = none
restore = <super> KEY_DOWN

# Mover: deformacion elastica discreta (friccion alta = poco "gelatina").
# Al redimensionar no hay gelatina: titan-wobbly-guard (apps/wayfire-titan)
# la quita al empezar y el siguiente movimiento parte de cero.
[wobbly]
friction = 5.0
spring_k = 9.0
grid_resolution = 6

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 14
quarter_snap_threshold = 40
workspace_switch_after = 600

[resize]
activate = <super> BTN_RIGHT

[place]
mode = center

# ---------------------------------------------------------------------------
# Mosaico (como Hyprland): las ventanas nuevas se acoplan solas y se reparten
# la pantalla. Apagado por defecto (Inti debe ser fácil para quien viene de
# Windows); se enciende en Ajustes > Ventanas, que cambia tile_by_default:
#   none = apagado      la condición de abajo = encendido
# Se quedan flotando: la ventana de contraseña, Acerca de, el teclado en
# pantalla, la Bienvenida y los avisos de zenity/kdialog. Los diálogos con
# ventana madre nunca entran en el mosaico.
# ---------------------------------------------------------------------------
[simple-tile]
tile_by_default = none
# Las teclas por defecto chocan con las de Inti (Super+T Terminal, Super+L
# Bloquear, Super+M Minimizar, Super+H/J/K): se mueven.
key_toggle = <super> <shift> KEY_T
key_focus_left = <super> <alt> KEY_LEFT
key_focus_right = <super> <alt> KEY_RIGHT
key_focus_above = <super> <alt> KEY_UP
key_focus_below = <super> <alt> KEY_DOWN
key_toggle_maximized = none
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
inner_gap_size = 6
outer_horiz_gap_size = 8
outer_vert_gap_size = 8
animation_duration = 220
keep_fullscreen_on_adjacent = true

# ---------------------------------------------------------------------------
# Liquid Glass: desenfoque real detras de las capas de titan-shell
# ---------------------------------------------------------------------------
# Solo barra, Dock, centro de control, Launchpad, notificaciones, etc.
# (layer-shell con espacio de nombres titan-*). El fondo y los iconos del
# escritorio (capas background/bottom) no se desenfocan. Las zonas
# totalmente transparentes de una capa no reciben desenfoque.
[blur]
blur_by_default = (type equals "panel" | type equals "overlay") & app_id contains "titan-"
method = kawase
kawase_offset = 2.6
kawase_degrade = 3
kawase_iterations = 3
# Algo de saturacion, como el "vibrancy" de macOS.
saturation = 1.35
# Con poca opacidad (tintes del 20-40 %) el desenfoque ya es completo.
alpha_threshold = 0.12
alpha_exponent = 0.7

# ---------------------------------------------------------------------------
# Escritorios y vistas
# ---------------------------------------------------------------------------
[vswitch]
duration = 380ms circle
gap = 24
wraparound = false
background = 0.06 0.07 0.12 1.0
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = none
binding_down = none
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
with_win_up = none
with_win_down = none
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8

[vswipe]
enable_horizontal = true
enable_vertical = false
enable_smooth_transition = true
fingers = 3
gap = 24
background = 0.06 0.07 0.12 1.0

# Gestos del panel tactil (plugin titan-gestos, como en Ubuntu/Fedora/macOS).
# Tres dedos a los lados cambian de escritorio ([vswipe]). Acciones:
# "ipc metodo/de/wayfire", "comando programa" o "none".
[titan-gestos]
activado = true
arriba_3 = ipc scale/toggle
abajo_3 = comando titan-shell --tecla escritorio
arriba_4 = comando titan-shell --toggle-launcher
abajo_4 = ipc expo/toggle
pellizcar_4 = comando titan-shell --toggle-launcher
separar_4 = comando titan-shell --tecla escritorio

[scale]
# Win+Tab como la Vista de tareas de Windows
toggle = <ctrl> KEY_UP | <super> KEY_TAB
toggle_all = none
duration = 420ms circle
spacing = 36
outer_margin = 60
inactive_alpha = 0.85
allow_zoom = false
middle_click_close = true
include_minimized = true
minimized_alpha = 0.55
title_overlay = all
title_position = bottom
title_font_size = 13
bg_color = 0.10 0.10 0.12 0.75
text_color = 1.0 1.0 1.0 1.0

[expo]
toggle = <ctrl> <super> KEY_UP
duration = 380ms circle
offset = 16
inactive_brightness = 0.7
background = 0.06 0.07 0.12 1.0

# Alt+Tab lo hace titan-shell (ver [command]): muestra a que app se cambia.
[fast-switcher]
activate = none
activate_backward = none
inactive_alpha = 0.6

[wm-actions]
minimize = <super> KEY_M
toggle_maximize = <super> KEY_F
toggle_fullscreen = <super> <shift> KEY_F
toggle_always_on_top = none
toggle_sticky = none
# Super+D lo hace titan-shell (ver [command]): el de Wayfire restauraba todas
# las ventanas en cuanto se abria una app nueva.
toggle_showdesktop = none

# ---------------------------------------------------------------------------
# Barra Titan para las apps que no dibujan la suya (titan-decor, plugin propio
# basado en el decoration de Wayfire): semaforos a la izquierda, titulo
# centrado y colores del tema Titan (claro/oscuro de ~/.config/titan/theme.conf).
# kitty oculta su barra en Wayfire (KITTY_CONF_DECORACION en
# 15-titan-grafico.sh) y aqui se le fuerza la Titan.
# ---------------------------------------------------------------------------
[titan-decor]
follow_titan_theme = true
font = Inter Semi-Bold
title_height = 28
border_size = 3
button_order = close minimize maximize
forced_views = app_id is "kitty"

# Apagar pantallas, bloquear y suspender lo hace titan-inactividad (swayidle,
# igual en Wayfire y labwc; tiempos en Ajustes > Bloquear pantalla). Aqui
# solo queda que un video a pantalla completa impida la inactividad.
[idle]
dpms_timeout = -1
screensaver_timeout = -1
disable_on_fullscreen = true

# ---------------------------------------------------------------------------
# Atajos que lanzan programas (mismos que en labwc/rc.xml)
# ---------------------------------------------------------------------------
[command]
# Super solo (al soltar) abre el Launchpad, como en labwc.
binding_launcher = <super>
command_launcher = titan-shell --toggle-launcher
binding_launcher_espacio = <super> KEY_SPACE
command_launcher_espacio = titan-shell --toggle-launcher
binding_terminal = <super> KEY_T
command_terminal = titan-terminal
binding_archivos = <super> KEY_E
command_archivos = titan-finder
# Ctrl+Mayús+Esc: Monitor de recursos (como el Administrador de tareas de Windows)
binding_monitor = <ctrl> <shift> KEY_ESC
command_monitor = titan-monitor
# Como Windows: Ctrl+Alt+Supr (bloquear, cambiar de usuario, apagar...),
# Win+I (Ajustes), Win+V (historial del portapapeles), Win+. (emojis) y
# Win+F1 (lista de atajos). Las pinta titan-shell (PanelSistema.qml).
binding_seguridad = <ctrl> <alt> KEY_DELETE
command_seguridad = titan-shell --tecla seguridad
binding_ajustes_win = <super> KEY_I
command_ajustes_win = titan-shell --tecla ajustes
binding_portapapeles = <super> KEY_V
command_portapapeles = titan-shell --tecla portapapeles
binding_emojis = <super> KEY_DOT
command_emojis = titan-shell --tecla emojis
binding_atajos = <super> KEY_F1
command_atajos = titan-shell --tecla atajos
# Win+X: menú de herramientas (como el de Windows); Win+P: proyectar
binding_herramientas = <super> KEY_X
command_herramientas = titan-shell --tecla herramientas
binding_proyectar = <super> KEY_P
command_proyectar = titan-shell --tecla proyectar
binding_fondos = <super> KEY_W
command_fondos = titan-shell --toggle-wallpaper
binding_tema = <super> <shift> KEY_D
command_tema = titan-shell --toggle-theme
binding_bloquear = <super> KEY_L
command_bloquear = titan-bloquear
binding_escritorios = <super> KEY_UP
command_escritorios = titan-shell --toggle-workspaces
# Capturas de pantalla (titan-captura): como Windows/GNOME y como macOS
binding_captura = KEY_SYSRQ
command_captura = titan-captura pantalla
binding_captura_area = <shift> KEY_SYSRQ
command_captura_area = titan-captura area
binding_captura_mac = <super> <shift> KEY_3
command_captura_mac = titan-captura pantalla
binding_captura_area_mac = <super> <shift> KEY_4
command_captura_area_mac = titan-captura area
binding_captura_area_win = <super> <shift> KEY_S
command_captura_area_win = titan-captura area
# Grabar la pantalla (otra vez el mismo atajo para parar y guardar)
binding_grabar = <super> <shift> KEY_5
command_grabar = titan-grabar
binding_grabar_area = <super> <shift> KEY_6
command_grabar_area = titan-grabar area
# Lector de pantalla (Orca), como en GNOME
binding_lector = <super> <alt> KEY_S
command_lector = titan-lector
# Teclas especiales del teclado: volumen, brillo, luz del teclado, multimedia
# y lanzadores. Las hace titan-shell (--tecla) y muestra el nivel en la Isla
# Dinamica. Volumen y brillo se repiten si se deja pulsada la tecla.
repeatable_binding_volumen_subir = KEY_VOLUMEUP
command_volumen_subir = titan-shell --tecla volumen-subir
repeatable_binding_volumen_bajar = KEY_VOLUMEDOWN
command_volumen_bajar = titan-shell --tecla volumen-bajar
binding_silenciar = KEY_MUTE
command_silenciar = titan-shell --tecla silenciar
binding_micro = KEY_MICMUTE
command_micro = titan-shell --tecla micro-silenciar
repeatable_binding_brillo_subir = KEY_BRIGHTNESSUP
command_brillo_subir = titan-shell --tecla brillo-subir
repeatable_binding_brillo_bajar = KEY_BRIGHTNESSDOWN
command_brillo_bajar = titan-shell --tecla brillo-bajar
repeatable_binding_teclado_subir = KEY_KBDILLUMUP
command_teclado_subir = titan-shell --tecla teclado-subir
repeatable_binding_teclado_bajar = KEY_KBDILLUMDOWN
command_teclado_bajar = titan-shell --tecla teclado-bajar
binding_teclado_luz = KEY_KBDILLUMTOGGLE
command_teclado_luz = titan-shell --tecla teclado-alternar
binding_reproducir = KEY_PLAYPAUSE
command_reproducir = titan-shell --tecla reproducir
binding_reproducir_cd = KEY_PLAYCD
command_reproducir_cd = titan-shell --tecla reproducir
binding_pausa = KEY_PAUSECD
command_pausa = titan-shell --tecla pausa
binding_siguiente = KEY_NEXTSONG
command_siguiente = titan-shell --tecla siguiente
binding_anterior = KEY_PREVIOUSSONG
command_anterior = titan-shell --tecla anterior
binding_parar = KEY_STOPCD
command_parar = titan-shell --tecla parar
binding_calculadora = KEY_CALC
command_calculadora = titan-shell --tecla calculadora
binding_navegador = KEY_WWW
command_navegador = titan-shell --tecla navegador
binding_correo = KEY_MAIL
command_correo = titan-shell --tecla correo
binding_ajustes = KEY_CONFIG
command_ajustes = titan-shell --tecla ajustes
binding_buscar = KEY_SEARCH
command_buscar = titan-shell --tecla buscar
binding_bloqueo_tecla = KEY_COFFEE
command_bloqueo_tecla = titan-shell --tecla bloquear
binding_pantallas = KEY_SWITCHVIDEOMODE
command_pantallas = titan-shell --tecla pantallas
binding_alt_tab = <alt> KEY_TAB
command_alt_tab = titan-shell --tecla alt-tab
binding_alt_tab_atras = <alt> <shift> KEY_TAB
command_alt_tab_atras = titan-shell --tecla alt-tab-atras
binding_ver_escritorio = <super> KEY_D
command_ver_escritorio = titan-shell --tecla escritorio
# Fin de las teclas especiales
