# Inti OS - sesion inmersiva con Wayfire 0.11
#
# Wayfire es el compositor por defecto cuando hay GPU con aceleracion 3D:
# aporta lo que labwc no tiene (animaciones de ventana, desenfoque real,
# deformacion al mover, vistas de ventanas y escritorios). Sin GPU (VMs sin
# 3D, nomodeset, titan.compat) la sesion sigue siendo labwc; lo decide
# /etc/profile.d/15-titan-grafico.sh.
#
# titan-shell (barra, Dock, centro de control...) es el mismo en las dos
# sesiones: usa layer-shell y wlr-foreign-toplevel, y en Wayfire ademas el
# IPC para los escritorios.
#
# Atajos (iguales que en labwc salvo los nuevos marcados con *):
#   Super                 Launchpad          Super+Espacio   Launchpad
#   Super+T               Terminal           Super+E         Archivos
#   Super+W               Fondos             Super+Shift+D   Claro/oscuro
#   Super+L               Bloquear           Super+Q         Cerrar ventana
#   Super+M               Minimizar          Super+F         Maximizar
#   Super+Arriba          Escritorios (titan-shell)
#   Super+1..8            Ir al escritorio N
#  *Ctrl+Arriba           Todas las ventanas (scale)
#  *Ctrl+Super+Arriba     Vista de escritorios (expo)
#  *Ctrl+Super+Izq/Der    Escritorio anterior/siguiente (con deslizamiento)
#  *Super+Izq/Der         Ventana a media pantalla
#   Alt+Tab               Cambiar de ventana
#  *3 dedos izq/der       Cambiar de escritorio (touchpad)
#   Super+arrastrar       Mover ventana      Super+boton der.  Redimensionar

[core]
plugins = \
  alpha \
  animate \
  autostart \
  blur \
  command \
  expo \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  ipc \
  ipc-rules \
  move \
  place \
  resize \
  scale \
  shortcuts-inhibit \
  titan-decor \
  titan-wobbly-guard \
  vswipe \
  vswitch \
  wm-actions \
  wobbly \
  xdg-activation

# Escritorios en una fila; titan-shell muestra solo los que esten en uso.
vwidth = 8
vheight = 1

# Las apps dibujan su propia barra (las Titan son sin marco con semaforos,
# Firefox y GTK con CSD). titan-decor pone la barra Titan (semaforos) a las
# XWayland (OnlyOffice) y a las de [titan-decor] forced_views (kitty).
preferred_decoration_mode = client
xwayland = true
close_top_view = <super> KEY_Q
background_color = 0.06 0.07 0.12 1.0
focus_button_with_modifiers = false

[autostart]
autostart_wf_shell = false
titan = /usr/local/bin/titan-sesion

# ---------------------------------------------------------------------------
# Animaciones
# ---------------------------------------------------------------------------
[animate]
# Abrir y cerrar: zoom suave desde el centro de la ventana.
open_animation = zoom
close_animation = zoom
zoom_duration = 260ms circle
# Minimizar: la ventana se "aspira" hacia su icono del Dock (titan-shell le
# pasa la posicion con wlr-foreign-toplevel set_rectangle). Al restaurar
# desde el Dock hace el camino inverso.
minimize_animation = squeezimize
squeezimize_duration = 420ms circle
duration = 260ms circle
fade_duration = 160ms circle
startup_duration = 600ms circle
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
# Los paneles de titan-shell ya se animan en QML; solo el resto de overlays
# (menus emergentes de otras apps) hace fundido.
fade_enabled_for = type equals "overlay" & !(app_id contains "titan-")

# Maximizar, media pantalla y restaurar: fundido cruzado entre tamanos.
[grid]
type = crossfade
duration = 300ms circle
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = none
restore = <super> KEY_DOWN

# Mover: deformacion elastica discreta (friccion alta = poco "gelatina").
# Al redimensionar no hay gelatina: titan-wobbly-guard (apps/wayfire-titan)
# la quita al empezar y el siguiente movimiento parte de cero.
[wobbly]
friction = 5.0
spring_k = 9.0
grid_resolution = 6

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 14
quarter_snap_threshold = 40
workspace_switch_after = 600

[resize]
activate = <super> BTN_RIGHT

[place]
mode = center

# ---------------------------------------------------------------------------
# Liquid Glass: desenfoque real detras de las capas de titan-shell
# ---------------------------------------------------------------------------
# Solo barra, Dock, centro de control, Launchpad, notificaciones, etc.
# (layer-shell con espacio de nombres titan-*). El fondo y los iconos del
# escritorio (capas background/bottom) no se desenfocan. Las zonas
# totalmente transparentes de una capa no reciben desenfoque.
[blur]
blur_by_default = (type equals "panel" | type equals "overlay") & app_id contains "titan-"
method = kawase
kawase_offset = 2.6
kawase_degrade = 3
kawase_iterations = 3
# Algo de saturacion, como el "vibrancy" de macOS.
saturation = 1.35
# Con poca opacidad (tintes del 20-40 %) el desenfoque ya es completo.
alpha_threshold = 0.12
alpha_exponent = 0.7

# ---------------------------------------------------------------------------
# Escritorios y vistas
# ---------------------------------------------------------------------------
[vswitch]
duration = 380ms circle
gap = 24
wraparound = false
background = 0.06 0.07 0.12 1.0
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = none
binding_down = none
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
with_win_up = none
with_win_down = none
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8

[vswipe]
enable_horizontal = true
enable_vertical = false
enable_smooth_transition = true
fingers = 3
gap = 24
background = 0.06 0.07 0.12 1.0

[scale]
toggle = <ctrl> KEY_UP
toggle_all = none
duration = 420ms circle
spacing = 36
outer_margin = 60
inactive_alpha = 0.85
allow_zoom = false
middle_click_close = true
include_minimized = false
title_overlay = all
title_position = bottom
title_font_size = 13
bg_color = 0.10 0.10 0.12 0.75
text_color = 1.0 1.0 1.0 1.0

[expo]
toggle = <ctrl> <super> KEY_UP
duration = 380ms circle
offset = 16
inactive_brightness = 0.7
background = 0.06 0.07 0.12 1.0

[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB
inactive_alpha = 0.6

[wm-actions]
minimize = <super> KEY_M
toggle_maximize = <super> KEY_F
toggle_fullscreen = <super> <shift> KEY_F
toggle_always_on_top = none
toggle_sticky = none
toggle_showdesktop = <super> KEY_D

# ---------------------------------------------------------------------------
# Barra Titan para las apps que no dibujan la suya (titan-decor, plugin propio
# basado en el decoration de Wayfire): semaforos a la izquierda, titulo
# centrado y colores del tema Titan (claro/oscuro de ~/.config/titan/theme.conf).
# kitty oculta su barra en Wayfire (KITTY_CONF_DECORACION en
# 15-titan-grafico.sh) y aqui se le fuerza la Titan.
# ---------------------------------------------------------------------------
[titan-decor]
follow_titan_theme = true
font = Inter Semi-Bold
title_height = 28
border_size = 3
button_order = close minimize maximize
forced_views = app_id is "kitty"

[idle]
dpms_timeout = 900
screensaver_timeout = -1
disable_on_fullscreen = true

# ---------------------------------------------------------------------------
# Atajos que lanzan programas (mismos que en labwc/rc.xml)
# ---------------------------------------------------------------------------
[command]
# Super solo (al soltar) abre el Launchpad, como en labwc.
binding_launcher = <super>
command_launcher = titan-shell --toggle-launcher
binding_launcher_espacio = <super> KEY_SPACE
command_launcher_espacio = titan-shell --toggle-launcher
binding_terminal = <super> KEY_T
command_terminal = titan-terminal
binding_archivos = <super> KEY_E
command_archivos = titan-finder
binding_fondos = <super> KEY_W
command_fondos = titan-shell --toggle-wallpaper
binding_tema = <super> <shift> KEY_D
command_tema = titan-shell --toggle-theme
binding_bloquear = <super> KEY_L
command_bloquear = titan-shell --lock
binding_escritorios = <super> KEY_UP
command_escritorios = titan-shell --toggle-workspaces
