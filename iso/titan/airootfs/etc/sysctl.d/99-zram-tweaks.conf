# /etc/sysctl.d/99-zram-tweaks.conf
# Optimización de gestión de memoria virtual para zram, Live USB y CPUs modestas (Intel Celeron / 4 GB RAM)

# Agresividad de zram para retener páginas activas en RAM comprimida
vm.swappiness = 150
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Preservar la caché de inodos y directorios en RAM para acelerar navegación y búsquedas
vm.vfs_cache_pressure = 50

# Escritura asíncrona fluida a disco/USB para evitar bloqueos del sistema (USB write freezes)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Minimizar ciclos de compactación proactiva de memoria en CPUs de baja potencia
vm.compaction_proactiveness = 0

# Acelerar asignación de grupos de tareas en el programador de CPU
kernel.sched_autogroup_enabled = 1
