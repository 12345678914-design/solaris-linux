# Inti OS - kitty (titan-terminal) con el aspecto de Titan.
# Configuracion del sistema: kitty la usa si el usuario no tiene la suya en
# ~/.config/kitty/kitty.conf.

font_family      JetBrains Mono
font_size        11.0
window_padding_width 8
cursor_shape     beam
cursor_blink_interval 0.6
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
initial_window_width  100c
initial_window_height 28c

# Colores Titan (oscuro), los mismos que la barra de las ventanas.
background            #1b1d24
foreground            #e6e8ee
selection_background  #2f5aa8
selection_foreground  #ffffff
cursor                #e6e8ee
url_color             #5aa2ff
# negro / gris
color0  #2a2d36
color8  #5c6170
# rojo
color1  #ff5f57
color9  #ff7b74
# verde
color2  #28c840
color10 #5be070
# amarillo
color3  #febc2e
color11 #ffd060
# azul
color4  #3d8bff
color12 #6aa8ff
# magenta
color5  #c678dd
color13 #d79bea
# cian
color6  #2ec4d6
color14 #5fd8e6
# blanco
color7  #c8ccd6
color15 #ffffff

# Barra de la ventana:
# - labwc: kitty pide la del compositor (semaforos del tema Titan-macOS).
# - Wayfire: la sesion exporta KITTY_CONF_DECORACION="hide_window_decorations yes"
#   y el plugin titan-decor le pone la barra Titan. Si kitty dibujara la suya,
#   habria dos barras.
wayland_titlebar_color background
envinclude KITTY_CONF_*
