# Titan Linux / Solaris Linux - Configuración de NVIDIA DRM para Wayland
# modeset=1 y fbdev=1 son requeridos para GPUs NVIDIA modernas (RTX 20/30/40/50 Series) en Wayland/Labwc
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp

