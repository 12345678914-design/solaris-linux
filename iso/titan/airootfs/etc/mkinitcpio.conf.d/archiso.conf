# Configuracion de initramfs para la ISO en vivo de Titan Linux.
#
# Los hooks 'archiso', 'archiso_loop_mnt' y 'memdisk' permiten arrancar tanto
# directamente desde un USB/CD como desde imagenes ISO cargadas por Ventoy o loopback.
# 'kms' y 'microcode' garantizan inicializacion temprana de GPU y CPU en hardware real.
#
# NO lleva autodetect a proposito: se quiere la imagen completa de controladores
# para que la ISO arranque en cualquier maquina, no solo en el hardware del host.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
