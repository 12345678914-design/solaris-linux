# Configuracion de initramfs para la ISO en vivo de Titan Linux.
#
# El hook 'archiso' es el que busca la ISO, monta airootfs.erofs y lo superpone
# con overlayfs antes de hacer switch_root. Sin el, el kernel arranca y se queda
# en un shell de emergencia.
#
# NO lleva autodetect a proposito: se quiere la imagen completa de controladores
# para que la ISO arranque en cualquier maquina, no solo en el hardware del host.
HOOKS=(base udev modconf archiso block filesystems)
