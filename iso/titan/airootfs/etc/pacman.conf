#
# /etc/pacman.conf - Titan Linux Live
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Descarga paralela rápida y presentación moderna
ParallelDownloads = 5
Color
ILoveCandy
VerbosePkgLists
CheckSpace

# Niveles de firma para repositorios oficiales de Arch
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional

# Repositorio de Inti OS: apps, herramientas, plugins de Wayfire, tema y el
# nucleo linux-titanlinux. Solo acepta paquetes firmados con la clave de Inti
# (paquete inti-keyring). Se activa cuando la clave este publicada.
#[inti]
#SigLevel = Required DatabaseOptional
#Server = https://github.com/12345678914-design/inti-repo/releases/download/paquetes

# Los servidores los elige titan-actualizar-sistema (Ajustes > General):
# "estable" = Arch de hace 7 dias (archive.archlinux.org); "al dia" = espejos.
[core]
Include = /etc/pacman.d/titan-servidores

[extra]
Include = /etc/pacman.d/titan-servidores

[multilib]
Include = /etc/pacman.d/titan-servidores

