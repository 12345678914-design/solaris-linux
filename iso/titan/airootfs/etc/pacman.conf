#
# /etc/pacman.conf - Titan Linux Live
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Descarga paralela rápida y presentación moderna
ParallelDownloads = 5
Color
ILoveCandy
VerbosePkgLists
CheckSpace

# Niveles de firma para repositorios oficiales de Arch
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

