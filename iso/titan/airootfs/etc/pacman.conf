#
# /etc/pacman.conf - Titan Linux Live
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Descarga paralela rápida y presentación moderna
ParallelDownloads = 5
Color
ILoveCandy
VerbosePkgLists
CheckSpace

# Niveles de firma para repositorios oficiales de Arch
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional

# Los servidores los elige titan-actualizar-sistema (Ajustes > General):
# "estable" = Arch de hace 7 dias (archive.archlinux.org); "al dia" = espejos.
[core]
Include = /etc/pacman.d/titan-servidores

[extra]
Include = /etc/pacman.d/titan-servidores

[multilib]
Include = /etc/pacman.d/titan-servidores

