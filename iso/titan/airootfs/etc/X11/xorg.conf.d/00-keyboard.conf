# Inti OS - distribucion del teclado del escritorio (formato de localectl).
# En el live: Español (España); se cambia en Ajustes > Teclado. El instalador
# escribe aqui la que se elija al instalar.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "es"
EndSection
