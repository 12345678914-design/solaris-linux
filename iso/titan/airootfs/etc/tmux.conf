# /etc/tmux.conf - Titan Linux 0.1
#
# POR QUE ESTA ESTE FICHERO
#
# Pides que, cuando la salida de un comando se sale de la pantalla, se pueda
# volver a leer, y que la parte de abajo (la ultima linea) este siempre a la
# vista. En la consola de texto del kernel eso no se puede conseguir:
#
#   - El kernel solo sabe hacer scroll en la consola VGA de texto, y solo del
#     contenido que queda en la memoria fisica del adaptador (scrollback
#     "duro", unos cientos de lineas como mucho).
#   - En la ISO, la consola acaba dibujar fbcon sobre un framebuffer de DRM:
#     en UEFI con simple-framebuffer/simpledrm, y en BIOS porque bochs-drm
#     desactiva la consola VGA ("bochs-drm: vgaarb: deactivate vga console").
#     fbcon no implementa el scroll del todo: su unica opcion de software
#     scrollback esta descartada a proposito en el propio kernel, con un
#     pr_warn("Ignoring scrollback size option").
#   - Shift+RePag si llega hasta el handler de scroll del VT (el keymap por
#     defecto lo mapea ahi), pero ese handler llama a con_scrolldelta, que en
#     fbcon no existe: no hay a quien llamar y no se mueve nada. Medido en
#     ambos modos de arranque: 0,00 % de cambio de pantalla.
#   - No hay parametro de kernel que lo arregle. Ojo: console_scrollback NO
#     existe (nunca estuvo en mainline) y fbcon=scrollback:N se ignora.
#
# Asi que el historial lo pone un terminal de espacio de usuario. tmux guarda
# 50000 lineas por panel, la vista sigue a la cola de la salida (la ultima
# linea siempre visible) y se vuelve atras con RePag.
#
# POR QUE RePag Y NO Shift+RePag (medido tecla a tecla en el live, no de oidas)
#
# El keymap del kernel (defkeymap, el que trae Arch) ATA al VT las teclas de
# pagina CON SHIFT pulsado: las traduce a la accion de scroll del VT y no
# llegan nunca a la tty. Medido con 'cat -v' leyendo de la tty3 (sin tmux):
#
#   shift-pgup   -> (nada)          el kernel se lo come
#   shift-pgdn   -> (nada)          idem
#   shift-f9     -> (nada)          idem (y pasa con todo el bloque de F y
#                                  navegacion: Inicio, Fin, flechas...)
#   alt-pgup     -> ^[5~            llega, pero IGUAL que RePag solo
#   ctrl-pgup    -> ^[5~            llega, pero IGUAL que RePag solo
#   pgup         -> ^[5~            llega y es distinguible  <-- esta es la buena
#   pgdn         -> ^[6~            llega y es distinguible
#   f9           -> ^[20~           llega y es distinguible
#
# O sea: ni Shift+ ni Alt+ sirven (o no llegan, o llegan indistinguibles), y
# tmux no puede hacer scroll si la tecla no le llega. Shift+RePag no se puede
# enlazar porque no existe: la tecla se pierde en el kernel. RePag a secas es
# justo lo que la consola de texto hace llegar, asi que el historial se maneja
# con RePag, y quien venga de un terminal grafico tambien tiene la rueda.
#
# Teclas (las de siempre de tmux):
#   RePag / rueda arriba    historial hacia atras, una pantalla por pulsacion
#   AvPag / rueda abajo     volver hacia la cola de la salida
#   q o Esc                salir del historial y volver al final
#   Ctrl+b d                desprender la sesion (la shell sigue corriendo)
#   Ctrl+b c                ventana nueva
#   exit                    cerrar la sesion del todo
#
# La barra de estado se desactiva a proposito: el objetivo es que la consola
# se vea igual que una consola normal, solo que ademas tiene historial.

# Cuantas lineas se recuerdan por panel. El limite por defecto (2000) se
# queda corto en cuanto un 'pacman -S' o un log largo llena la pantalla.
set -g history-limit 50000

# Sin barra de estado: la consola tiene que parecer una consola.
set -g status off

# Los paneles talkean 256 colores con 'screen-256color' (lo trae ncurses, que
# ya esta en la ISO) en vez de 'tmux-256color', que no siempre viene.
set -g default-terminal "screen-256color"

# La shell de dentro arranca como shell de login, para que siga saliendo el
# banner de Titan (/etc/profile.d/10-titan.sh) igual que antes de tmux.
set -g default-command "exec bash -l"

# Los menus de tmux con teclado tardan medio segundo de mas por defecto.
set -g escape-time 10
set -g repeat-time 500
set -g focus-events on

# --- historial --------------------------------------------------------------
# '-u' entra en el historial por ARRIBA (no por la linea donde esta el
# cursor), que es lo que se quiere al releer algo que ya se salio de pantalla.
#
# Ojo con la rueda: estos dos son los enlaces que trae tmux de serie y NO se
# tocan. El de la rueda hacia abajo hace 'send-keys -M' a proposito, porque
# un '-X scroll-down 5' con ese 5 de numero NO FUNCIONA (ver abajo): no
# moveria ni una linea.
#
# 'mouse on' va antes de los enlaces de la rueda para que los coga.
set -g mouse on
bind -n WheelUpPane   if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -u'
bind -n WheelDownPane send-keys -M

# --- dentro del historial ---------------------------------------------------
# '-n' (sin tabla) es para el modo root, o sea el normal, no el historial:
# RePag a la entrada.
bind -n PPage copy-mode -u

# Ojo con los NOMBRES de las teclas: tmux llama a RePag 'PPage' (previous
# page) y a AvPag 'NPage' (next page). Escribir 'PageUp' o 'S-PageUp' NO da
# error: se ignora en silencio y la tecla se queda sin hacer nada. Comprobado
# con 'tmux list-keys -T copy-mode' sobre tmux 3.7c.
#
# Y OJO con el numero que se le puede poner a las ordenes de scroll: NO HACE
# NADA. Medido sobre tmux 3.7c con un panel de 500 lineas de historial y una
# ventana de 24 filas:
#
#   scroll-up         -> +1 linea    (no una pantalla, como parece)
#   scroll-up 10      -> +0 lineas   el 10 se ignora, sin avisar
#   page-up           -> +22 lineas  una ventana menos dos lineas
#   page-down         -> -22 lineas
#   history-top       -> al principio del todo
#   history-bottom    -> a la cola de la salida
#
# Por eso RePag usa 'page-up' y no 'scroll-up': con 'scroll-up' hay que
# pulsar 22 veces para subir una pantalla, y con el numero puesto no sube
# ninguna. Y AvPag usa 'history-bottom' para volver de golpe a la ultima
# linea, que es lo que se quiere.
#
# Dentro del historial manda la tabla copy-mode, NO la de root: por eso hace
# falta enlazar las teclas aqui tambien, o si no se sueltan a la shell
# ('^[[5~' por pulsacion) y no pasan nada.
bind -T copy-mode      PPage   send-keys -X page-up
bind -T copy-mode      NPage   send-keys -X history-bottom
bind -T copy-mode      Up      send-keys -X cursor-up
bind -T copy-mode      Down    send-keys -X cursor-down
bind -T copy-mode      Home    send-keys -X history-top
bind -T copy-mode      End     send-keys -X history-bottom
bind -T copy-mode-vi   PPage   send-keys -X page-up
bind -T copy-mode-vi   NPage   send-keys -X history-bottom
bind -T copy-mode-vi   Up      send-keys -X cursor-up
bind -T copy-mode-vi   Down    send-keys -X cursor-down
bind -T copy-mode-vi   Home    send-keys -X history-top
bind -T copy-mode-vi   End     send-keys -X history-bottom

# Volver al final: 'q' y Esc salen del modo copia. tmux siempre devuelve la
# vista a la cola de la salida, que es la parte de abajo de siempre.
bind -T copy-mode     q      send-keys -X cancel
bind -T copy-mode     Escape send-keys -X cancel
bind -T copy-mode-vi  q      send-keys -X cancel
bind -T copy-mode-vi  Escape send-keys -X cancel

# Copiar seleccion arrastrando con el raton. Sin argumentos, tmux la guarda en
# su propio portapapeles (se pega con Ctrl+b ]), que es lo unico que hay en el
# live: no hay xclip porque no hay X. El default de tmux es copy-pipe, que
# intenta copiar a un portapapeles que aqui no existe.
bind -T copy-mode     MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi  MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
