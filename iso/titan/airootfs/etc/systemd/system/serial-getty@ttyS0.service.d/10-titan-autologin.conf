# Autologin tambien en la consola serie. Necesario para las pruebas
# automaticas: con console=ttyS0 en la linea de comandos del kernel,
# systemd genera serial-getty@ttyS0 y esta unitad lo salta directo a la shell.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin titan --noclear %I 115200 $TERM
