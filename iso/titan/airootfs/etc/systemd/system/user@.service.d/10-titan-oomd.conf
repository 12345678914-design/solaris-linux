# Inti OS: systemd-oomd vigila la sesion del usuario (como Fedora en
# systemd-oomd-defaults y Ubuntu desde 22.04). Si la presion de memoria pasa
# del 50% durante 20 s, cierra el grupo de procesos que la causa (la app que se
# esta comiendo la memoria) en vez de dejar que el equipo se congele.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
