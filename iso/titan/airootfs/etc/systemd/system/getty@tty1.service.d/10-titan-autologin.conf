# Autologin en la consola virtual 1: al arrancar la ISO se entra directo a la
# shell de titan, sin usuario ni contrasena. Es el comportamiento esperado de
# una imagen en vivo.
#
# El ultimo argumento de agetty es el valor de TERM. Antes decia '$TERM', que
# systemd expande a vacio (no es una variable de entorno de los servicios), de
# modo que la consola se quedaba sin TERM: 'less' salia en blanco y negro sin
# saber de que tipo de terminal, y tmux (que envuelve esta consola, ver
# /etc/tmux.conf) se negaba a arrancar sin un terminal valido. 'linux' es el
# tipo de terminal de una consola de texto de Linux, y lo implementa el propio
# VT, asi que es el que corresponde.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin titan --noclear %I linux
Type=idle
