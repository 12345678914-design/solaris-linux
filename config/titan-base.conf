# Titan Linux -- variables globales de personalizacion.
#
# Un solo sitio para cambiar el nombre de la distribucion, el usuario, el
# terminal o el explorador. Lo leen el escritorio Qt (en el sistema instalado
# como /etc/titan/base.conf) y los scripts de la ISO.
#
# Formato: CLAVE="valor", una por linea, sin espacios alrededor del '='.
# ASCII a proposito: el fichero se puede leer desde bash y desde C++.

TITAN_SO_NOMBRE="Titan Linux"
TITAN_SO_VERSION="0.2.0"
TITAN_SO_ID="titan"
TITAN_SO_WEB="https://github.com/titan-linux"

# Cuenta con la que se entra al escritorio y nombre de la maquina.
TITAN_USUARIO="titan"
TITAN_HOSTNAME="titan"

# Programas del escritorio. El terminal y el explorador son decisiones de
# proyecto: kitty y pcmanfm-qt (Qt, ligero, sin arrastrar toda la pila KDE).
TITAN_TERMINAL="kitty"
TITAN_EXPLORADOR="pcmanfm-qt"
TITAN_ESCRITORIO="labwc"

# Acciones del boton Inicio. Se ejecutan directamente desde el centro de
# aplicaciones, sin pasar por una sesion de texto.
TITAN_APAGAR="systemctl poweroff"
TITAN_REINICIAR="systemctl reboot"

# Colores del fondo del escritorio (degradado).
TITAN_FONDO_COLOR1="#101a33"
TITAN_FONDO_COLOR2="#2a1a4a"

# Barra de tareas inferior. El boton de inicio va justo despues de las apps
# ancladas. Los valores de color son #RRGGBB; el alfa va aparte (0.0 a 1.0).
TITAN_BARRA_ALTO="56"
TITAN_BARRA_FONDO="#0b1020"
TITAN_BARRA_ALFA="0.92"
TITAN_BARRA_ACENTO="#4fc4ff"
TITAN_INICIO_TEXTO="Inicio"

# Centro de aplicaciones (la tarjeta que aparece al pulsar Inicio).
TITAN_CENTRO_ANCHO="900"
TITAN_CENTRO_ALTO="620"
TITAN_CENTRO_COLUMNAS="5"
TITAN_CENTRO_OSCURIDAD="0.55"
